name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m py_compile scripts/*.py tests/test_public_workflow.py
      - name: Validate JSON examples
        run: |
          python -m json.tool config/project-config.example.json >/dev/null
          python -m json.tool config/project-context.example.json >/dev/null
